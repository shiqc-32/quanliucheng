    in_csv: "@paths.rur_eval_csv"
    out_png: "@paths.rur_dz0_fig"
# ------------------------------------------------------------

# ------------------- 物理方案数据生成 ----------------------
phys_input:
  enable: true
  in_csv: "@paths.urban_zclean_output"

  out_r_f_csv: "@paths.r_f_total_csv"
  out_rp_profiles_csv: "@paths.rp_profiles_csv"
  out_table1_csv: "@paths.table1_kanda_csv"

  # Kanda 使用 M1 或 M2
  kanda_method: "M1"

  # 数据筛选：ideal(只 fg=0) / real(只 fg=1) / mixed(两者都保留)
  fg_mode: "real"

  # X/Y 范围；不想限制可以设为 null
  x_min: null
  x_max: null
  y_min: null
  y_max: null

  filters:
    enable: true
    strict: true
    missing_policy: drop
    inclusive: true
    ranges:
      lp: {min: 0.1, max: 1.0}
      lf: {min: 0.1, max: 1.0}
      have: {min: 0.0}
      hmax: {min: 0.0}
      hstd: {min: 0.0}
      # x/y 也可在这里控制（会自动映射到 columns 里定义的 X/Y）
      x: {min: 700.0, max: 1200.0}
      y: {min: 700.0, max: 1200.0}

  # 列名映射（按你现在数据表头来的）
  columns:
    fg: "fg"
    lf: "lf"
    lp: "lp"
    have: "have"
    hmax: "hmax"
    hstd: "hstd"
    d_LES: "d"
    z0_LES: "z0"
    x: "x"          # 如果你现在是 meta__X 就写 "meta__X"
    y: "y"          # 同理
    rp_prefix: "rp_"  # rp 列前缀，例如 rp_0, rp_1, ...
# ------------------------------------------------------------

# --------------- rur方案计算失效检查 -------------------------
dz0_check:
  enable: true
  
  # 引用上方的 paths 变量
  rp_profiles_csv: "@paths.rp_profiles_csv"
  r_f_total_csv:   "@paths.r_f_total_csv"
  table1_csv:      "@paths.table1_kanda_csv"
  out_problem_csv: "@paths.z0_nan_sites"
  
  # 原始 Fortran 参数
  nsites: 538          # total urban sites
  nk: 89               # total layers of the original urban data
  dz: 2.0
  nL_default: 8
  drp_threshold: 0.01
# ------------------------------------------------------------