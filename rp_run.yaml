# ------------------------------------------------------------

# ------------------- rp_ave/std计算部分参数 ------------------
compute:
  method: "step1m"   # "step1m" | "equal8"
  step: 1.0          # 仅在 "step1m" 下有效
# ------------------------------------------------------------

# ------------------- 案例名称对应部分参数 ---------------------
columns:
  flow_case_col: "NameE"     # flowdata 中案例名称列
  meta_case_col: "NameE"     # metadata 中案例名称列
  meta_config_col: "Config"  # metadata 中配置类型列（新增）
  xy_col: "x-y"              # metadata 中的 x-y 列（新增）

params:
  cutoff: 0.72               # 模糊匹配阈值，越高越严格（0~1）

  flow_encoding: "us-ascii"        # 固定搭配！！！不许换！！！
  meta_encoding: "gb18030"         # 固定搭配！！！不许换！！！

  encoding: "utf-8-sig"       # （建议）rp_ave_std 的编码；若不需要可删
  map_encoding: "utf-8-sig"      # （建议）保存/读取映射表的编码

  sep: ","                   # 分隔符（如是制表符，改为 "\t"）

  seed: 42                   # 随机种子（可选）
  device: "auto"             # 【新增】TabPFN/RF 设备选择：cpu / cuda / auto
# ------------------------------------------------------------

# ------------------- 选择并改名：任务定义 --------------------
select_rename_tasks:
  urban:
    columns: ["flow_name", "Config", "meta__lf", "meta__lp", "meta__hmean", "meta__hmax", "meta__hstd", "flow__d", "flow__z0", "meta__gammaH", "meta__gamma", "rp_ave", "rp_std","meta__X", "meta__Y"]
    rename_map:
      flow_name: case_name
      Config: fg
      meta__lf: lf
      meta__lp: lp
      meta__hmean: have
      meta__hmax: hmax
      meta__hstd: hstd
      flow__d: d
      flow__z0: z0
      meta__gammaH: gammah
      meta__gamma: gamma
      rp_ave: rpave
      rp_std: rpstd
      meta__X: x
      meta__Y: y

  kanda:
    columns: ["ID", "FG", "lambda_f", "lambda_p", "Have", "Hmax", "Hstd", "zero_displacement_height", "z0", "H_d", "H_z0", "rp_ave", "rp_std"]
    rename_map:
      ID: case_name
      FG: fg
      lambda_f: lf
      lambda_p: lp
      Have: have
      Hmax: hmax
      Hstd: hstd
      zero_displacement_height: d
      z0: z0
      H_d: hd
      H_z0: hz0
      rp_ave: rpave
      rp_std: rpstd
# ------------------------------------------------------------

# ------------------- Z-score 清洗+删除负值 -------------------
clean:
  columns: ["lf", "lp", "have", "hmax", "hstd", "d", "z0"]    # 参与Z分数的列（必填，且为数值列）
  z_thresh: 3.0
  mode: "drop"                     # "drop"删除异常行；"flag"仅标记
  keep_na: true
  # input_encoding: "gb18030"      # 如输入不是UTF-8，可指定
# ------------------------------------------------------------

# ------------------- 分布检查参数 -------------------------
dist_check:
  enable: true                  # 是否开启分布检查
  in_csv: "@paths.urban_model_input"   # 已清洗后的数据路径（和清洗输出一致）
  out_dir: "@paths.checker_output"     # 分布检查结果输出目录

  # 要检查的列：建议写“参与预测的所有特征 + 目标”
  # 如果留空或不写，会自动用数据中所有数值型列
  columns:
    - lp
    - lf
    - have
    - hmax
    - hstd
    # - hd
    # - hz0
    # - z0       # 目标
    # - d        # 目标（如果有）

  # 统计参数
  stats:
    quantiles: [0.05, 0.25, 0.5, 0.75, 0.95]
  
  # 依据 fg 分组/筛选
  fg_filter:
    enable: true         # 是否按 fg 分组/筛选输出
    fg_col: fg           # fg 列名
    keep: [0]           # 取值: 0 / 1 / [0] / [1] / [0,1] / both
    output_mode: split   # split=分别输出 fg0/fg1；single=按 keep 输出一套

  # 绘图参数（可选）
  plot:
    enable: true
    bins: 30
    figsize: [4, 3]     # 单张图大小（英寸）
    dpi: 150

    kde:
      enable: true        # 叠加形状分布曲线
      bw_method: null     # 可选: null/"scott"/"silverman"/0.2(数值更平滑或更尖)
      grid: 400           # KDE 曲线采样点数，越大越平滑

# ------------------------------------------------------------

# ------------------- 物理方案参数输入 -------------------------
phys:
  mac_kanda:
    csv: "/stu02/shiqc24/d_z0_ML/quanliucheng/rur/data_in/Table1-Urban.csv"
    kanda_method: "M1"   # 或 "M2"，可选

# ------------------------------------------------------------

# ------------------- tabpfn 任务定义 -------------------------

  ############################################################
  # 全部参数合集：
tabpfn_task_base: &tabpfn_base
  in_csv: "@paths.urban_zclean_output"  # 数据输入路径
  # test_csv: "@paths.tabpfn_test_csv"  # 双 CSV 情况下的测试集路径（可选）
  test_split: 0.2                       # 训练测试集划分
  target: "z0"                          # 预测目标
  # 统一用一套形态学特征（不含 z0、d 本身）
  feature_cols : ["lp", "lf", "have", "hmax", "hz0"]  # 参与预测的变量
  kf_num: 5                                           # 交叉验证折数
  log_modes: [false]                                  # 是否取对数开关
  output_prefix: "urban_z0_bin"                       # 输出文件前缀/文件夹名
  preprocess:
    align: "intersection"   # 单 CSV 情况下实际不会用到，但保留字段便于复制到双 CSV 任务
    dropna_target: true     # 先丢掉 z0 为 NaN 的样本
    fillna_median: true     # 对特征中数值缺失用中位数填补
    drop_constant: true     # 删除常量列
  shap:
    enable: false        # 是否启用 SHAP（默认 false）
    max_samples: 200    # 测试集中最多拿多少个样本做 SHAP
  binning:
    enable: true          # 开关分箱训练，默认是true
    n_bins: 8             # 分箱数量
    mode: "undersample"   # 或 "balance"
    strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
    max_per_bin: 150      # 每箱最多样本数
  ############################################################

  ############################################################
  #   案例：分箱情况调整
  # - 可调范围：分箱数量、每箱样本数、分箱策略、分箱模式
  #   1) nobin: urban - z0
  #   2）strategy: "uniform" + urban数据-z0
  #   3）nobin: urban - d
  #   4) strategy: "uniform" + urban数据-d
  #   5）nobin: kanda - z0
  #   6）strategy: "uniform" + kanda数据-z0
  #   7）nobin: kanda - d
  #   8）strategy: "uniform" + kanda数据-d
  ############################################################

tabpfn_tasks:
  # --------- urban + 不分箱 + z0-----------------
  urban_z0_nobin:
    <<: *tabpfn_base
    in_csv: "@paths.urban_zclean_output"  # 数据输入路径
    target: "z0"                          # 预测目标
    output_prefix: "urban_z0_bin"         # 输出文件前缀/文件夹名
    binning:
      enable: false                       # 开关分箱训练
  # --------------------------------------------

  # --------- urban + 分箱 + z0------------------
  urban_z0_bin_uni:
    <<: *tabpfn_base
    in_csv: "@paths.urban_zclean_output"  # 数据输入路径
    target: "z0"                          # 预测目标
    output_prefix: "urban_z0_bin_uni"     # 输出文件前缀/文件夹名
    binning:
      enable: true          # 开关分箱训练，默认是true
      n_bins: 8             # 分箱数量
      mode: "undersample"   # 或 "balance"
      strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
      max_per_bin: 150      # 每箱最多样本数
  # --------------------------------------------

  # --------- urban + 不分箱 + d-----------------
  urban_d_nobin:
    <<: *tabpfn_base
    in_csv: "@paths.urban_zclean_output" # 数据输入路径
    target: "d"                          # 预测目标
    feature_cols : ["lp", "lf", "have", "hmax", "hd"]  # 参与预测的变量
    output_prefix: "urban_d_nobin"       # 输出文件前缀/文件夹名
    binning:
      enable: false                      # 开关分箱训练
  # --------------------------------------------

  # --------- urban + 分箱 + d------------------
  urban_d_bin_uni:
    <<: *tabpfn_base
    in_csv: "@paths.urban_zclean_output"  # 数据输入路径
    target: "d"                           # 预测目标
    feature_cols : ["lp", "lf", "have", "hmax", "hd"]  # 参与预测的变量
    output_prefix: "urban_d_bin_uni"      # 输出文件前缀/文件夹名
    binning:
      enable: true          # 开关分箱训练，默认是true
      n_bins: 8             # 分箱数量
      mode: "undersample"   # 或 "balance"
      strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
      max_per_bin: 150      # 每箱最多样本数
  # --------------------------------------------

  # --------- kanda + 不分箱 + z0-----------------
  kanda_z0_nobin:
    <<: *tabpfn_base
    in_csv: "@paths.kanda_zclean_output"  # 数据输入路径
    target: "z0"                          # 预测目标
    output_prefix: "kanda_z0_bin"         # 输出文件前缀/文件夹名
    binning:
      enable: false                       # 开关分箱训练
  # --------------------------------------------

  # --------- kanda + 分箱 + z0-----------------
  kanda_z0_bin_uni:
    <<: *tabpfn_base
    in_csv: "@paths.kanda_zclean_output"  # 数据输入路径
    target: "z0"                          # 预测目标
    output_prefix: "kanda_z0_bin_uni"     # 输出文件前缀/文件夹名
    binning:
      enable: true          # 开关分箱训练，默认是true
      n_bins: 8             # 分箱数量
      mode: "undersample"   # 或 "balance"
      strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
      max_per_bin: 150      # 每箱最多样本数
  # --------------------------------------------

  # --------- kanda + 不分箱 + d-----------------
  kanda_d_nobin:
    <<: *tabpfn_base
    in_csv: "@paths.kanda_zclean_output"  # 数据输入路径
    target: "d"                           # 预测目标
    feature_cols : ["lp", "lf", "have", "hmax", "hd"]  # 参与预测的变量
    output_prefix: "kanda_d_nobin"        # 输出文件前缀/文件夹名
    binning:
      enable: false                       # 开关分箱训练
  # --------------------------------------------

  # --------- kanda + 分箱 + d-----------------
  kanda_d_bin_uni:
    <<: *tabpfn_base
    in_csv: "@paths.kanda_zclean_output"  # 数据输入路径
    target: "d"                           # 预测目标
    feature_cols : ["lp", "lf", "have", "hmax", "hd"]  # 参与预测的变量
    output_prefix: "kanda_d_bin_uni"      # 输出文件前缀/文件夹名
    binning:
      enable: true          # 开关分箱训练，默认是true
      n_bins: 8             # 分箱数量
      mode: "undersample"   # 或 "balance"
      strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
      max_per_bin: 150      # 每箱最多样本数
  # --------------------------------------------

  ############################################################
  #   案例：只预测 z0，但对“是否把 d 当作输入特征”做对比
  # - 对 kanda / urban 分别构造两种特征集：
  #   1) 不含 d
  #   2) 含 d
  #   仍然是 8:2 划分 + 5 折 CV，只动 feature_cols
  ############################################################

  # ---- kanda: 不含 d 的特征集 ----
  kanda_z0_no_d_tabpfn:
    <<: *tabpfn_base
    in_csv: "@paths.kanda_zclean_output"
    target: "z0"
    feature_cols: ["lp", "lf", "have", "hmax", "hz0"]   # 不包含 d
    output_prefix: "kanda_z0_no_d"
  # --------------------------------------------

  # ---- kanda: 含 d 的特征集 ----
  kanda_z0_with_d_tabpfn:
    <<: *tabpfn_base
    in_csv: "@paths.kanda_zclean_output"
    target: "z0"
    feature_cols: ["lp", "lf", "have", "hmax", "hz0", "d"]   # 加入 d 作为输入
    output_prefix: "kanda_z0_with_d"
  # --------------------------------------------

  # ---- urban: 不含 d 的特征集 ----
  urban_z0_no_d_tabpfn:
    <<: *tabpfn_base
    in_csv: "@paths.urban_zclean_output"
    target: "z0"
    feature_cols: ["lp", "lf", "have", "hmax", "hz0"]
    output_prefix: "urban_z0_no_d"
  # --------------------------------------------


  # ---- urban: 含 d 的特征集 ----
  urban_z0_with_d_tabpfn:
    <<: *tabpfn_base
    in_csv: "@paths.urban_zclean_output"
    target: "z0"
    feature_cols: ["lp", "lf", "have", "hmax", "hz0", "d"]
    output_prefix: "urban_z0_with_d"
  # --------------------------------------------

  ############################################################
  #   案例：用两套数据交换做测试训练集检查效果
  # - 对 kanda / urban 分别构造两种案例：
  #   1) kanda训练→urban测试 d
  #   2) kanda训练→urban测试 z0
  #   3) urban训练→kanda测试 d
  #   4) urban训练→kanda测试 z0
  #   5) urban+kanda 混合训练测试 d
  #   6) urban+kanda 混合训练测试 z0
  #   7) 只用urban d
  #   8) 只用urban z0
  #   9) 只用kanda d
  #   10) 只用kanda z0
  ############################################################

  # ---- kanda训练→urban测试 d ----
  kanda_to_urban_d:
    <<: *tabpfn_base               # 1. 继承上面所有配置
    
    # 覆盖 I/O 参数，启用双 CSV 模式
    in_csv: null                   # 置空，避免混淆（虽代码优先读 train/test，但这样更清晰）
    test_split: 0.2                       # 训练测试集划分
    
    train_csv: "@paths.kanda_zclean_output"  # 显式指定训练集
    test_csv: "@paths.urban_zclean_output"    # 显式指定测试集
    target: "d"
    feature_cols : ["lp", "lf", "have", "hmax", "hd"]  # 参与预测的变量

    # 修改输出前缀，防止文件覆盖
    output_prefix: "kanda_to_urban_d"
    binning:
      enable: true          # 开关分箱训练，默认是true
      n_bins: 8             # 分箱数量
      mode: "undersample"   # 或 "balance"
      strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
      max_per_bin: 150      # 每箱最多样本数
  # --------------------------------------------

  # ---- kanda训练→urban测试 z0 ----
  kanda_to_urban_z0:
    <<: *tabpfn_base               # 1. 继承
    
    # 覆盖 I/O 参数 (反过来)
    in_csv: null
    test_split: 0.2                       # 训练测试集划分
    
    train_csv: "@paths.kanda_zclean_output"  # 显式指定训练集
    test_csv: "@paths.urban_zclean_output"    # 显式指定测试集
    target: "z0"

    # 修改输出前缀
    output_prefix: "kanda_to_urban_z0"
    binning:
      enable: true          # 开关分箱训练，默认是true
      n_bins: 8             # 分箱数量
      mode: "undersample"   # 或 "balance"
      strategy: "uniform"   # "uniform" | "quantile" → 推荐 uniform
      max_per_bin: 150      # 每箱最多样本数
  # --------------------------------------------

  # ---- urban训练→kanda测试 d ----
  urban_to_kanda_d:
    <<: *tabpfn_base               # 1. 继承上面所有配置
    
    # 覆盖 I/O 参数，启用双 CSV 模式
